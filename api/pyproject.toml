[project]
name = "ragdoctor"
version = "0.1.0"
description = "Chat with documents, an admin lab and a doctor that explains why a RAG system answers wrong."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "João Paulo" }]
dependencies = [
    # The engine: chunkers, PostgreSQL search, pipeline, metrics, judge, cache, experiment runner.
    "ragbench[pdf] @ git+https://github.com/joaopaulopresa/rag-bench@v0.1.0",
    "alembic>=1.13",
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
ragdoctor = "ragdoctor.cli:main"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdoctor"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs PostgreSQL (docker compose up -d db)"]
addopts = "-ra --strict-markers"

[tool.ruff.lint.per-file-ignores]
# The report's stylesheet and page skeleton are long string literals.
"src/ragdoctor/doctor/report.py" = ["E501"]
